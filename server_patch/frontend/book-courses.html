function getWave(n) {
 if (n >= 1 && n <= 62) return 1;
 if (n >= 63 && n <= 92) return 2;
 if (n >= 93 && n <= 117) return 3;
 if (n >= 118 && n <= 147) return 4;
 if (n >= 148 && n <= 177) return 5;
 if (n >= 178 && n <= 207) return 6;
 if (n >= 208 && n <= 238) return 7;
 if (n >= 239 && n <= 268) return 8;
 if (n >= 269 && n <= 298) return 9;
 if (n >= 299 && n <= 328) return 10;
 if (n >= 329 && n <= 336) return 11;
 if (n >= 337 && n <= 363) return 12;
 if (n >= 364 && n <= 390) return 13;
 if (n >= 391 && n <= 418) return 14;
 if (n >= 419 && n <= 445) return 15;
 if (n >= 446 && n <= 472) return 16;
 if (n >= 473 && n <= 500) return 17;
 return 0;
}

function stars(n){var s='';for(var i=0;i<5;i++)s+='<span class="diff-star'+(i<n?' on':'')+'"></span>';return s;}

function render(){
 var g=document.getElementById('courseContainer');
 var filtered=COURSES;
 if(currentCat!=='all') filtered=filtered.filter(function(c){return c.c===currentCat;});
 if(currentWave!==0) filtered=filtered.filter(function(c){return getWave(c.n)===currentWave;});
 var html='';
 var cats={};
var labels={period:' 周期理论',invest:' 投资哲学',risk:' 风险管理',money:' 货币与制度',demo:' 人口与地缘',china:' 中国经济',behavior:' 行为金融',wealth:' 财富管理',tech:' 技术与未来',inequality:' 贫富与不平等',history:' 经济金融史',global:' 全球宏观',future:' 未来经济',ai:' AI与认知',bio:' 生物科技',energy:' 能源气候',geo:' 地缘安全',science:' 前沿科学',east:' 东方智慧',kk:' 凯文·凯利'};
 var descs={period:'理解经济的四季更替',invest:'大师的投资智慧传承',risk:'塔勒布的不确定性四部曲',money:'理解金融的制度逻辑',demo:'慢变量中的大趋势',china:'读懂中国的经济密码',behavior:'大脑如何欺骗你',wealth:'从储蓄到财务自由',tech:'技术如何重塑世界',inequality:'理解财富分配的逻辑',history:'以史为鉴知兴替',global:'把握全球资产配置方向',future:'AI与区块链重塑经济范式',ai:'人工智能与认知革命',bio:'生命科学与长寿经济',energy:'能源转型与气候博弈',geo:'大国博弈与地缘安全',science:'物理学、数学与复杂科学',east:'东方哲学与中华智慧',kk:'凯文·凯利思想全集'};
 filtered.forEach(function(c){
 var cn=c.c;
 if(!cats[cn]){cats[cn]={label:labels[cn]||cn,desc:descs[cn]||'',list:[]};}
 cats[cn].list.push(c);
 });
 for(var k in cats){
 var cat=cats[k];
 html+='<div class="cat-section" data-cat="'+k+'"><div class="cat-header"><div class="cat-icon">'+cat.label.substring(0,2)+'</div><div class="cat-info"><div class="cat-title">'+cat.label+'</div><div class="cat-sub">'+cat.desc+'</div></div><div class="cat-count">'+cat.list.length+' 课</div></div><div class="course-grid">';
 cat.list.forEach(function(c){
 html+='<a href="book'+c.n+'.html" class="course-card"><div class="course-num">'+c.n+'</div><div class="course-info"><div class="course-title">'+c.t+'</div><div class="course-author">'+c.a+'</div></div><div class="course-diff">'+stars(c.d)+'</div></a>';
 });
 html+='</div></div>';
 }
 g.innerHTML=html;
 document.getElementById('noResults').classList.add('hidden');
 if(Object.keys(cats).length===0) document.getElementById('noResults').classList.remove('hidden');
}

function filterCat(cat){
 currentCat=cat;
 document.querySelectorAll('.cat-tab').forEach(function(t){t.classList.remove('active')});
 document.querySelector('.cat-tab[onclick*="'+cat+'"]').classList.add('active');
 render();
}

function filterWave(w){
 currentWave=w;
 document.querySelectorAll('.wave-tab').forEach(function(t){t.classList.remove('active')});
 document.querySelectorAll('.wave-tab')[w].classList.add('active');
 render();
}

render();
</script>

<script>
// === 购书链接注入 (书目课程页) ===
(function(){
 function bookIdFromCard(card){
  var href = card.getAttribute('href') || '';
  var m = href.match(/book(\d+)\.html/);
  return m ? m[1] : '';
 }
 function injectPurchaseLinks(){
  document.querySelectorAll('.course-card').forEach(function(card){
   if (card.querySelector('.buy-links')) return;
   var bookId = bookIdFromCard(card);
   if (!bookId) return;
   var buy = document.createElement('div');
   buy.className = 'buy-links';
   buy.style.cssText = 'display:flex;gap:4px;margin-left:auto;flex-shrink:0';
   buy.innerHTML = '<a href="/api/shop/redirect/' + bookId + '?source=book_courses" target="_blank" rel="nofollow" style="font-size:.65rem;color:#171006;background:var(--gold);padding:3px 8px;border-radius:10px;border:1px solid rgba(226,182,79,.45)" title="购买正版书">购买</a>';
   card.appendChild(buy);
  });
 }
 var observer = new MutationObserver(injectPurchaseLinks);
 observer.observe(document.getElementById('courseContainer'), {childList:true, subtree:true});
 injectPurchaseLinks();
})();
</script>
